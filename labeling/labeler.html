<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spender labeler</title>
<style>
  body { margin: 0; padding: 16px 20px; background: var(--background-color-default, #fff); color: var(--text-color-default, #1f2328);
         font-family: var(--font-sans, system-ui, sans-serif); font-size: var(--text-body-medium, 14px); line-height: var(--leading-body-medium, 20px); }
  .muted { color: var(--text-color-muted, #656d76); }
  header { display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
  nav button { background: none; border: 0; padding: 4px 8px; color: inherit; font: inherit; cursor: pointer; border-bottom: 2px solid transparent; }
  nav button.on { border-color: var(--true-color-blue, #0969da); font-weight: var(--font-weight-semibold, 600); }
  .bar { height: 4px; background: var(--border-color-default, #d0d7de); border-radius: 2px; margin: 8px 0 12px; }
  .bar div { height: 100%; background: var(--true-color-green, #1a7f37); border-radius: 2px; }
  .notice { padding: 6px 10px; border-radius: 6px; background: var(--true-color-yellow-muted, #fff8c5); margin-bottom: 8px; }
  .notice:empty { display: none; }
  h1 { font-size: var(--text-title-large, 24px); line-height: 1.2; margin: 0; }
  .meta { margin: 2px 0 14px; }
  /* The card's one job: who spent it, and need or want. Two slots, side by side. */
  .decide { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; margin-bottom: 6px; }
  .slot { padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border-color-default, #d0d7de); }
  .slot.todo { border-color: var(--true-color-blue, #0969da); }
  .slot.ok { background: var(--true-color-green-muted, #dafbe1); border-color: transparent; }
  .slot-name { font-size: 12px; color: var(--text-color-muted, #656d76); }
  .slot-body { font-size: 16px; margin: 2px 0; }
  .slot-keys { font-size: 12px; color: var(--text-color-muted, #656d76); }
  .next { margin: 4px 0 0; }
  .sub { font-size: 12px; color: var(--text-color-muted, #656d76); }
  table { border-collapse: collapse; width: 100%; margin-top: 12px; }
  td, th { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--border-color-default, #d0d7de); white-space: nowrap; }
  td.desc { white-space: normal; overflow-wrap: anywhere; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  th[data-sort] { cursor: pointer; user-select: none; }
  .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
  tr.cur { outline: 2px solid var(--color-focus-outline, #0969da); outline-offset: -2px; }
  kbd { font-family: var(--font-mono, monospace); border: 1px solid var(--border-color-default, #d0d7de); border-radius: 4px; padding: 0 4px; }
  footer { position: sticky; bottom: 0; margin-top: 16px; padding: 8px 0; display: flex; gap: 14px; flex-wrap: wrap;
           background: var(--background-color-default, #fff); border-top: 1px solid var(--border-color-default, #d0d7de); z-index: 1; }
  input, select { font: inherit; padding: 4px 6px; color: inherit; background: inherit; border: 1px solid var(--border-color-default, #d0d7de); border-radius: 6px; }
  #backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 10; }
  .modal { position: fixed; top: 5vh; left: 50%; transform: translateX(-50%); width: min(560px, 92vw); max-height: 90vh; z-index: 11;
           box-sizing: border-box; background: var(--background-color-default, #fff); border: 1px solid var(--border-color-default, #d0d7de);
           border-radius: 8px; padding: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.2); }
  #picker { display: flex; flex-direction: column; }
  #picker ul { list-style: none; padding: 0; margin: 8px 0 0; overflow: auto; min-height: 0; }
  #picker li { padding: 2px 6px; cursor: pointer; }
  #picker li.cur { background: var(--true-color-blue-muted, #ddf4ff); }
  .hidden { display: none !important; }
  .conf { display: inline-block; width: 44px; height: 6px; margin-right: 6px; border-radius: 3px; vertical-align: middle; overflow: hidden;
          background: var(--border-color-default, #d0d7de); }
  .conf i { display: block; height: 100%; }
  .conf.low i { background: var(--true-color-red, #cf222e); }
  .conf.mid i { background: var(--true-color-yellow, #bf8700); }
  .conf.high i { background: var(--true-color-green, #1a7f37); }
  .labeled { font-weight: var(--font-weight-semibold, 600); }
  .rules { margin: 8px 0 0; font-size: 12px; }
  button.link { background: none; border: 0; padding: 0 4px; color: var(--true-color-blue, #0969da); cursor: pointer; font: inherit; }
  .miss { color: var(--true-color-red, #cf222e); }
  body.saving main, body.saving #pred, body.saving #audit { opacity: .45; pointer-events: none; }
</style>
</head>
<body>
<header>
  <nav><button data-mode="queue">Queue</button><button data-mode="predictions">Predictions</button><button data-mode="audit">Audit</button><button data-mode="rules">Rules</button><button data-mode="check">Check set</button></nav>
  <select id="order" title="Queue order (O)"></select>
  <span id="counts" class="muted"></span>
</header>
<div class="bar"><div id="progress" style="width:0"></div></div>
<div id="notice" class="notice"></div>
<main id="main"></main>
<div id="audit" class="hidden">
  <div class="controls">
    <select id="a-origin"><option value="">anyone</option></select>
    <input id="a-q" placeholder="search merchant, description or account">
    confidence <input id="a-min" size="4" value="0"> to <input id="a-max" size="4" value="1">
  </div>
  <table id="a-table"></table>
  <pre id="a-history" class="muted"></pre>
</div>
<div id="rules" class="hidden">
  <div class="controls"><input id="ru-q" placeholder="filter rules"> <span class="muted">Wealthfolio rules set categories on import;
    labeler rules set the spender after each daily sync. <kbd>X</kbd> twice removes the highlighted rule.</span></div>
  <table id="ru-table"></table>
</div>
<div id="pred" class="hidden">
  <div id="pr-model" class="muted"></div>
  <div class="controls">
    <input id="pr-q" placeholder="filter description or account">
    <select id="pr-value"><option value="">any prediction</option></select>
    confidence <input id="pr-min" size="4" value="0"> to <input id="pr-max" size="4" value="1">
    <button id="pr-accept">Accept selected (0)</button>
    <button id="pr-prev">‹</button><span id="pr-page" class="muted"></span><button id="pr-next">›</button>
  </div>
  <table id="pr-table"></table>
</div>
<div id="backdrop" class="hidden"></div>
<div id="rename" class="modal hidden"><input id="rn-q" list="rn-names" style="width:100%;box-sizing:border-box" placeholder="Merchant name; an existing name merges, blank resets">
  <datalist id="rn-names"></datalist><div id="rn-hint" class="muted"></div></div>
<input id="note" class="modal hidden" placeholder="One-line note for the next label; Enter to keep, Esc to cancel">
<div id="picker" class="modal hidden"><input id="p-q" placeholder="Type to filter; Enter to choose, Esc to cancel"><span id="p-hint" class="muted"></span><ul id="p-list"></ul></div>
<footer class="muted" id="keys"></footer>
<script>
const $ = (id) => document.getElementById(id);
const money = (n) => n.toLocaleString(undefined, { style: "currency", currency: "USD" });
const PAGE = 100;
const ORDERS = [["impact", "Biggest impact"], ["low-confidence", "Lowest confidence"], ["high-confidence", "Highest confidence"],
  ["newest", "Newest first"], ["oldest", "Oldest first"], ["amount", "Largest amount"], ["merchant", "Merchant A–Z"]];
const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
const pred = { rows: [], total: 0, sort: "confidence", dir: "asc", offset: 0, cur: 0, selected: new Map() };
let busy = false, pinned = null;  // a write in flight; the card to keep showing after labeling it
let confirmSkip = null;  // the incomplete card whose skip was asked about once
const needWantCell = (r) => (r.category ? esc(r.needWant || "—") : '<span class="miss" title="No category, so no need/want">✗ none</span>');
function missingText() {
  const m = card.missing, parts = [];
  if (m.spender) parts.push(`Spender not set on ${m.spender} row${m.spender === 1 ? "" : "s"}`);
  if (m.category) parts.push(`Need/Want not set on ${m.category} row${m.category === 1 ? "" : "s"}`);
  return parts.join(", ");
}
let seen = -1, config, mode = "queue", card = null, cur = 0, skip = [], note = "", categories = [], picker = null, audit = [], auditCur = 0;

async function api(path, body) {
  const res = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}
function flash(text) { $("notice").textContent = text; }
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]); }
function spenderKeys() { return Object.entries(config.spenders).map(([k, v]) => `<kbd>${k.toUpperCase()}</kbd> ${esc(v)}`).join(" "); }

let allKeys = store.get("labeler.keys") === "all";  // the full legend, toggled with ?
function legend() {
  if (!allKeys && (mode === "queue" || mode === "check")) {
    $("keys").innerHTML = `${spenderKeys()} <span><kbd>Shift</kbd> = whole merchant</span>
      ${mode === "check" ? "" : "<span><kbd>N</kbd>/<kbd>W</kbd> need/want</span>"} <span><kbd>→</kbd> next</span> <span><kbd>U</kbd> undo</span> <span><kbd>?</kbd> all keys</span>`;
    return;
  }
  const views = `<span><kbd>Tab</kbd>/<kbd>Shift+Tab</kbd> next/previous view</span> <span><kbd>R</kbd> refresh</span>${mode === "queue" || mode === "check" ? " <span><kbd>?</kbd> fewer keys</span>" : ""}`;
  const common = `${spenderKeys()} <span><kbd>Shift</kbd>+key labels the whole merchant, past and future</span>`;
  $("keys").innerHTML = mode === "rules" ? `<span><kbd>↑</kbd><kbd>↓</kbd> rule</span> <span><kbd>X</kbd> twice: remove</span> <span><kbd>U</kbd> undo</span>`
    : mode === "audit" ? `${common} <span><kbd>C</kbd>/<kbd>N</kbd>/<kbd>W</kbd> fix category</span> <span><kbd>U</kbd> undo</span> <span><kbd>↑</kbd><kbd>↓</kbd> row</span> <span><kbd>H</kbd> history</span>`
    : mode === "predictions" ? `${common} <span><kbd>Enter</kbd> accept prediction</span> <span><kbd>Space</kbd> select</span>
       <span><kbd>A</kbd> accept selected</span> <span><kbd>U</kbd> undo</span> <span><kbd>↑</kbd><kbd>↓</kbd> row</span> <span><kbd>PgUp</kbd><kbd>PgDn</kbd> page</span>`
    : `${common} <span><kbd>Enter</kbd> accept guess</span> <span><kbd>C</kbd> category</span> <span><kbd>N</kbd>/<kbd>W</kbd> pick a Need/Want category (<kbd>Enter</kbd> accepts the highlighted one)</span>
       <span><kbd>'</kbd> note</span> <span><kbd>→</kbd>/<kbd>Space</kbd> next card</span> <span><kbd>←</kbd> previous card</span> <span><kbd>U</kbd> undo</span> <span><kbd>↑</kbd><kbd>↓</kbd> row</span>
       ${mode === "queue" ? "<span><kbd>O</kbd> order</span> <span><kbd>M</kbd> rename merchant (<kbd>Shift</kbd>+M: only this row's raw name)</span>" : ""} <span><kbd>Esc</kbd> close</span>`;
  $("keys").insertAdjacentHTML("afterbegin", `${views} `);
}

// Loads overlap (focus refresh, the reload after a write, a fallback); only the newest may render.
let loads = 0;
async function load() {
  const mine = ++loads;
  document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("on", b.dataset.mode === mode));
  $("audit").classList.toggle("hidden", mode !== "audit");
  $("pred").classList.toggle("hidden", mode !== "predictions");
  $("rules").classList.toggle("hidden", mode !== "rules");
  $("order").classList.toggle("hidden", mode !== "queue");
  $("main").classList.toggle("hidden", ["audit", "predictions", "rules"].includes(mode));
  legend();
  if (mode === "audit") return loadAudit();
  if (mode === "predictions") return loadPredictions();
  if (mode === "rules") return loadRules();
  const data = await api(`/api/card?mode=${mode}&order=${$("order").value}&skip=${encodeURIComponent(skip.join("\n"))}${pinned ? `&key=${encodeURIComponent(pinned)}` : ""}`);
  if (mine !== loads) return;
  if (pinned && !data.card) { pinned = null; return load(); }
  const c = data.counts;
  seen = c.version;
  $("counts").textContent = mode === "check" ? `${c.rows.toLocaleString()} check rows left`
    : `${c.groups.toLocaleString()} merchants · ${c.rows.toLocaleString()} rows · ${money(c.amount)} left`;
  $("progress").style.width = `${Math.round(100 * (1 - c.rows / Math.max(c.total, 1)))}%`;
  if (c.notice && !/^Synced: 0 set, 0 cleared, 0 edits/.test(c.notice) && !$("notice").textContent) flash(c.notice);
  const same = card && data.card && card.key === data.card.key;
  card = data.card; cur = same ? Math.min(cur, card.rows.length - 1) : 0;
  render();
}

// Confidence as a percentage plus a short bar banded low/medium/high, so it scans at a glance.
function confCell(c) {
  if (c == null) return "";
  const band = c < 0.65 ? "low" : c < 0.85 ? "mid" : "high";
  return `<span class="conf ${band}" title="${band} confidence"><i style="width:${Math.round(c * 100)}%"></i></span>${Math.round(c * 100)}%`;
}
// A row's spender: its label (with where it came from), otherwise the model's prediction; reasons on hover.
function spenderCell(r) {
  if (r.spender) return `<td class="labeled" title="${esc(r.spenderWhy)}">${esc(r.spender)} <span class="muted">· ${esc(r.spenderBy)}</span></td>`;
  const g = r.guess;
  return `<td title="${esc(g.reasons.join("\n") || "no informative features yet")}">${esc(g.value)}? ${confCell(g.confidence)}</td>`;
}
const tally = (values) => [...values.reduce((m, v) => m.set(v, (m.get(v) || 0) + 1), new Map())];
const listed = (pairs) => (pairs.length === 1 ? esc(pairs[0][0]) : pairs.map(([v, c]) => `${c} ${esc(v)}`).join(" / "));
const plain = (html) => html.replace(/<[^>]+>/g, "");
function slot(name, done, body, keys) {
  return `<div class="slot ${done ? "ok" : "todo"}"><div class="slot-name">${name}${done ? " ✓" : ""}</div>
    <div class="slot-body">${body}</div>${done ? "" : `<div class="slot-keys">${keys}</div>`}</div>`;
}

function render() {
  if (!card) { $("main").innerHTML = `<h1>Nothing left to label here.</h1>`; return; }
  const rows = card.rows, row = rows[cur], s = card.summary, n = rows.length + card.more, m = card.missing;
  const title = card.merchant || row.notes || `(no description) ${row.type.toLowerCase()}`;
  const all = card.blind ? "" : ` · <kbd>Shift</kbd> = all ${n}`;
  const set = rows.filter((r) => r.spender);
  const spender = slot("Spender", !m.spender,
    !m.spender ? `<b>${listed(tally(set.map((r) => r.spender)))}</b> <span class="muted">${listed(tally(set.map((r) => r.spenderBy)))}</span>`
      : card.blind ? "Who spent this?"
      : `${esc(s.predicted[0][0])}? ${confCell(s.confidence)}${set.length ? ` <span class="muted">· ${m.spender} of ${n} unset</span>` : ""}`,
    `${spenderKeys()}${all}${card.blind ? "" : " · <kbd>Enter</kbd> accept"}`);
  const sorted = rows.filter((r) => r.category);
  const needWant = card.blind ? "" : slot("Need / Want", !m.category,
    !m.category ? `<b>${listed(tally(sorted.map((r) => r.needWant || "—")))}</b> <span class="muted">${listed(tally(sorted.map((r) => r.category)))}</span>`
      : `<span class="miss">✗</span> ${m.category} of ${n} without a category`,
    `<kbd>N</kbd> Need · <kbd>W</kbd> Want${all}`);
  const rules = card.rules.length ? `<div class="rules muted">Rules: ${card.rules.map((r, i) =>
    `<span title="${esc(plain(ruleText(r)))}">${esc(r.kind)} → ${esc(r.sets)} (${r.kind === "Category" ? "Wealthfolio" : "labeler"})
      <button class="link" data-rule="${i}">remove</button></span>`).join(" · ")}</div>` : "";
  $("main").innerHTML = `
    <h1>${esc(title)}</h1>
    <div class="meta muted">${n} row${n === 1 ? "" : "s"} · ${money(card.total)}${card.keys.length > 1 ? ` · includes ${card.keys.map(esc).join(", ")}` : ""}${card.labeledElsewhere ? ` · ${card.labeledElsewhere} more already labeled` : ""}</div>
    <div class="decide">${spender}${needWant}</div>
    ${!m.spender && !m.category ? `<p class="next"><kbd>→</kbd> next merchant</p>` : ""}${rules}
    ${note ? `<p>Note: <i>${esc(note)}</i></p>` : ""}
    <table><tr><th>Date</th><th class="num">Amount</th><th>Description</th>${card.blind ? "" : "<th>Category</th><th>Spender</th>"}</tr>
    ${rows.map((r, i) => `<tr class="${i === cur ? "cur" : ""}"><td>${r.date}</td><td class="num">${money(r.amount)}</td>
      <td class="desc">${esc(r.notes)}<div class="sub">${esc(r.account)}</div></td>
      ${card.blind ? "" : `<td title="${esc(r.categoryWhy || "")}">${r.category ? `${esc(r.category)} <span class="muted">· ${esc(r.needWant || "—")}${r.categoryOrigin && r.categoryOrigin !== "You" ? ` · ${esc(r.categoryOrigin)}` : ""}</span>` : '<span class="miss">✗</span>'}</td>${spenderCell(r)}`}</tr>`).join("")}
    </table>${card.more ? `<p class="muted">and ${card.more} more</p>` : ""}`;
}

// One write at a time: keys and clicks are dropped until it lands, so a double press cannot
// label twice or label the next card. After writing, the queue stays on the same card.
async function act(path, body) {
  if (busy) return false;
  if (card && (mode === "queue" || mode === "check")) pinned = card.key;
  busy = true; document.body.classList.add("saving"); flash("Saving…");
  try {
    const result = await api(path, body);
    if (result?.key && body?.merchant && pinned) pinned = result.key;  // a renamed card keeps showing under its new name
    note = ""; await load(); if ($("notice").textContent === "Saving…") flash(""); return result || true; }
  catch (e) { flash(e.message); return false; }
  finally { busy = false; document.body.classList.remove("saving"); }
}

async function label(value, whole) {
  const at = cur;
  const ok = whole && card.merchant && !card.blind ? await act("/api/label", { value, merchant: card.merchant, note })
    : await act("/api/label", { value, ids: [card.rows[cur].id], note, check: card.blind });
  const next = ok && !whole && card ? card.rows.findIndex((r, i) => i > at && !r.spender) : -1;
  if (next >= 0) { cur = next; render(); }
}
// Moving on from an incomplete card asks once, so a half-labeled merchant is never left by accident.
function nextCard() {
  if (!card) return;
  if (mode === "queue" && (card.missing.spender || card.missing.category) && confirmSkip !== card.key) {
    confirmSkip = card.key;
    return flash(`${missingText()}. Press → or Space again to skip anyway.`);
  }
  confirmSkip = null; flash("");
  skip.push(card.key); pinned = null; load().catch((e) => flash(e.message));
}
function previousCard() { if (skip.length) { pinned = skip.pop(); load().catch((e) => flash(e.message)); } }

// Which handler a key goes to: typing and open overlays swallow shortcuts; Esc always closes.
function routeKey(key, { overlay, typing, modifier }) {
  if (key === "Escape") return "close";
  if (overlay === "picker") return ["ArrowUp", "ArrowDown", "Enter"].includes(key) ? "picker" : "type";
  if (overlay || typing || modifier) return "ignore";
  return "shortcut";
}
const overlay = () => (picker ? "picker" : !$("note").classList.contains("hidden") ? "note" : !$("rename").classList.contains("hidden") ? "rename" : null);
function openOverlay(id) { $(id).classList.remove("hidden"); $("backdrop").classList.remove("hidden"); }
function closeOverlays() {
  picker = null;
  ["picker", "note", "rename", "backdrop"].forEach((id) => $(id).classList.add("hidden"));
  if (armed || removing) { armed = null; removing = false; flash(""); }
  document.activeElement?.blur();
}
$("backdrop").addEventListener("click", closeOverlays);

// A renamed merchant shows its name, with the raw description kept beside it.
const described = (r) => `${r.name && r.name !== r.merchant ? `<b>${esc(r.name)}</b> · ` : ""}${esc(r.notes)}`;
let renaming = null;
async function openRename(whole) {
  const row = card.rows[cur];
  if (!(whole ? card.merchant : row.merchant)) return flash("This row has no merchant name to rename.");
  const { suggestion, names } = await api(`/api/suggest?merchant=${encodeURIComponent(whole ? card.merchant : row.merchant)}`);
  renaming = whole ? { merchant: card.merchant } : { id: row.id };
  $("rn-names").innerHTML = names.map((n) => `<option value="${esc(n)}">`).join("");
  $("rn-hint").textContent = whole ? `Renames every row of ${card.keys.join(", ")}. Reuse an existing name to merge; leave blank to reset.`
    : `Renames only ${row.merchant}, splitting it out of ${card.merchant}.`;
  $("rn-q").value = suggestion; openOverlay("rename"); $("rn-q").focus(); $("rn-q").select();
}
$("rn-q").addEventListener("keydown", (e) => {
  if (e.key !== "Enter") return;
  e.preventDefault();
  const body = { ...renaming, name: $("rn-q").value };
  closeOverlays(); act("/api/rename", body);
});

const categoryName = (c) => `${c.parent ? c.parent + " › " : ""}${c.name}`;
// What a category or need/want key acts on: the highlighted row, or with Shift its whole merchant.
function pickTarget(whole) {
  const row = mode === "audit" ? audit[auditCur] : card?.rows[cur], name = mode === "audit" ? row?.name : card?.merchant;
  if (!row) return null;
  return whole && name ? { merchant: name, label: `all ${mode === "audit" ? "" : `${card.rows.length + card.more} `}rows of ${name}` }
    : { ids: [row.id], label: "this row" };
}
// The picker says exactly what Enter will do; N/W pre-select a suggested built-in category.
async function openPicker(filter, whole) {
  const target = pickTarget(whole);
  if (!target) return;
  picker = { filter, target, cur: 0, suggested: null };
  const action = `Set ${filter || "the category"} for ${target.label}`;
  $("p-hint").textContent = `${action} · type to choose · Esc cancel`;
  $("p-q").value = ""; $("p-list").innerHTML = "";
  openOverlay("picker"); $("p-q").focus();
  // Fetched on every open, so categories added in Wealthfolio meanwhile appear.
  const path = (c) => `${c.parent || c.name} › ${c.parent ? c.name : ""}`;
  categories = (await api("/api/categories")).sort((a, b) => path(a).localeCompare(path(b)));
  if (filter) {
    const where = target.merchant ? `merchant=${encodeURIComponent(target.merchant)}` : `id=${target.ids[0]}`;
    const s = await api(`/api/category-suggest?${where}&needWant=${filter}`);
    const suggested = categories.find((c) => c.id === s.categoryId);
    if (!picker || !suggested) return picker && listPicker();
    picker.suggested = suggested.id;
    $("p-hint").textContent = `${action} · Enter = ${categoryName(suggested)} (${s.why}) · type to choose another · Esc cancel`;
  }
  if (picker) listPicker();
}
function pickerItems() {
  const q = $("p-q").value.toLowerCase();
  const found = categories.filter((c) => (!picker.filter || c.needWant === picker.filter) && `${c.parent} ${c.name}`.toLowerCase().includes(q));
  const first = found.findIndex((c) => c.id === picker.suggested);
  return first > 0 ? [found[first], ...found.slice(0, first), ...found.slice(first + 1)] : found;
}
function listPicker() {
  const items = pickerItems();
  picker.cur = Math.min(picker.cur, Math.max(items.length - 1, 0));
  $("p-list").innerHTML = items.map((c, i) => `<li data-i="${i}" class="${i === picker.cur ? "cur" : ""}">${esc(c.parent ? c.parent + " › " : "")}${esc(c.name)} <span class="muted">${esc(c.needWant || "")}</span></li>`).join("");
  $("p-list").querySelector(".cur")?.scrollIntoView({ block: "nearest" });
}
async function choose(category) {
  const { merchant, ids } = picker.target, body = merchant ? { categoryId: category.id, merchant } : { categoryId: category.id, ids };
  closeOverlays();
  const result = await act("/api/category", body);
  // Merchant rules only fill empty categories; rows that already had another one are left alone.
  if (result?.kept) flash(`${categoryName(category)} set on ${result.categorized} row(s). ${result.kept} row(s) kept their existing category; change those one at a time with C, N or W.`);
}
function pickerKey(e) {
  const items = pickerItems();
  e.preventDefault();
  if (e.key === "ArrowDown") picker.cur = Math.min(picker.cur + 1, items.length - 1);
  else if (e.key === "ArrowUp") picker.cur = Math.max(picker.cur - 1, 0);
  else if (items[picker.cur]) return choose(items[picker.cur]);
  listPicker();
}
$("p-q").addEventListener("input", () => { picker.cur = 0; listPicker(); });
$("p-list").addEventListener("click", (e) => { const li = e.target.closest("li[data-i]"); if (li) choose(pickerItems()[+li.dataset.i]); });

$("note").addEventListener("keydown", (e) => {
  if (e.key === "Enter") { note = $("note").value.trim(); closeOverlays(); render(); e.preventDefault(); }
});

ORDERS.forEach(([value, name]) => $("order").add(new Option(name, value)));
$("order").value = ORDERS.some(([v]) => v === store.get("labeler.order")) ? store.get("labeler.order") : "impact";
function setOrder(value) { $("order").value = value; store.set("labeler.order", value); skip = []; pinned = null; load().catch((e) => flash(e.message)); }
$("order").addEventListener("change", () => { setOrder($("order").value); $("order").blur(); });

async function loadAudit() {
  seen = (await api("/api/version")).version;
  if ($("a-origin").options.length === 1) (await api("/api/origins")).forEach((o) => $("a-origin").add(new Option(o, o)));
  const q = new URLSearchParams({ origin: $("a-origin").value, min: $("a-min").value, max: $("a-max").value, q: $("a-q").value });
  audit = await api(`/api/audit?${q}`); auditCur = Math.min(auditCur, Math.max(audit.length - 1, 0)); renderAudit();
  $("counts").textContent = `${audit.length}${audit.length === 1000 ? "+" : ""} labeled row(s)${$("a-origin").value ? ` by ${$("a-origin").value}` : ""}`;
}
function renderAudit() {
  const by = (value, origin) => (value ? `${esc(value)} <span class="muted">· ${esc(origin || "")}</span>` : '<span class="miss">✗</span>');
  $("a-table").innerHTML = `<tr><th>Date</th><th class="num">Amount</th><th>Description</th><th>Category · by</th><th>Spender · by</th><th class="num">Conf.</th></tr>` +
    audit.map((r, i) => `<tr class="${i === auditCur ? "cur" : ""}"><td>${r.date}</td><td class="num">${money(r.amount)}</td>
      <td class="desc">${described(r)}<div class="sub">${esc(r.account)}</div></td>
      <td title="${esc(r.categoryWhy || "")}">${r.category ? `${esc(r.category)} <span class="muted">· ${esc(r.needWant || "—")} · ${esc(r.categoryOrigin || "")}</span>` : '<span class="miss">✗</span>'}</td>
      <td title="${esc(r.spenderWhy || "")}">${by(r.spender, r.spenderOrigin)}</td>
      <td class="num">${r.confidence == null ? "" : Math.round(r.confidence * 100) + "%"}</td></tr>`).join("");
}
const pct = (x) => (x && x.n ? `${Math.round(x.accuracy * 100)}% (n=${x.n})` : "n/a");
const COLUMNS = [["date", "Date"], ["description", "Description"], ["account", "Account"], ["amount", "Amount", "num"],
  ["category", "Category"], ["needWant", "Need/Want"], ["value", "Prediction"], ["confidence", "Confidence", "num"]];

async function loadPredictions() {
  const mine = loads;
  const q = new URLSearchParams({ q: $("pr-q").value, value: $("pr-value").value, min: $("pr-min").value, max: $("pr-max").value,
    sort: pred.sort, dir: pred.dir, offset: pred.offset, limit: PAGE });
  const data = await api(`/api/predictions?${q}`), m = data.model;
  if (mine !== loads) return;
  seen = data.version;
  Object.assign(pred, { rows: data.rows, total: data.total, cur: Math.min(pred.cur, Math.max(data.rows.length - 1, 0)) });
  if ($("pr-value").options.length === 1) Object.values(config.spenders).forEach((v) => $("pr-value").add(new Option(v, v)));
  const classes = Object.entries(m.classes).map(([v, c]) => `${v} ${c.examples.toLocaleString()} labels / ${c.merchants} merchants`).join(" · ");
  $("pr-model").innerHTML = `Model <b>${esc(m.model)}</b>, trained on ${m.examples.toLocaleString()} labels (${esc(classes)}).
    Accuracy: later period ${pct(m.laterPeriod)}, unseen merchants ${pct(m["unseenMerchants.purchaser"])}, blind check set ${pct(m.checkSet)}.
    ${m.autoApply ? `Predictions at ${Math.round(data.threshold * 100)}%+ confidence apply automatically.`
      : `Predictions apply automatically only after the blind check set shows at least 95% precision at ${Math.round(data.threshold * 100)}%+ confidence.`} ${m.warnings.map((w) => `<b>${esc(w)}</b>`).join(" ")}`;
  $("counts").textContent = `${data.total.toLocaleString()} unlabeled row(s) match · ${pred.selected.size} selected`;
  renderPredictions();
}

function renderPredictions() {
  const head = COLUMNS.map(([key, name, cls]) =>
    `<th class="${cls || ""}" data-sort="${key}">${name}${pred.sort === key ? (pred.dir === "asc" ? " ▲" : " ▼") : ""}</th>`).join("");
  $("pr-table").innerHTML = `<tr><th><input type="checkbox" id="pr-all" title="Select this page"></th>${head}<th>Top reason</th></tr>` +
    pred.rows.map((r, i) => `<tr class="${i === pred.cur ? "cur" : ""}" data-i="${i}">
      <td><input type="checkbox" data-i="${i}" ${pred.selected.has(r.id) ? "checked" : ""}></td><td>${r.date}</td>
      <td class="desc">${described(r)}</td><td>${esc(r.account)}</td><td class="num">${money(r.amount)}</td><td>${esc(r.category)}</td><td>${needWantCell(r)}</td>
      <td>${esc(r.guess.value)}</td><td class="num">${confCell(r.guess.confidence)}</td>
      <td class="desc muted" title="${esc(r.guess.reasons.join("\n"))}">${esc(r.guess.reasons[0] || "")}</td></tr>`).join("");
  $("pr-accept").textContent = `Accept selected (${pred.selected.size})`;
  $("pr-page").textContent = pred.total ? `${pred.offset + 1}–${pred.offset + pred.rows.length} of ${pred.total.toLocaleString()}` : "none";
}

function toggle(i, on) {
  const r = pred.rows[i];
  if (on ?? !pred.selected.has(r.id)) pred.selected.set(r.id, r.guess.value); else pred.selected.delete(r.id);
}
async function acceptSelected() {
  const items = [...pred.selected].map(([id, value]) => ({ id, value }));
  if (items.length && await act("/api/label", { accept: items })) pred.selected.clear();
  renderPredictions();
}
function page(step) {
  const next = pred.offset + step * PAGE;
  if (next < 0 || next >= pred.total) return;
  pred.offset = next; pred.cur = 0; loadPredictions().catch((e) => flash(e.message));
}
$("pr-table").addEventListener("click", (e) => {
  const th = e.target.closest("th[data-sort]"), tr = e.target.closest("tr[data-i]");
  if (th) { pred.dir = pred.sort === th.dataset.sort && pred.dir === "asc" ? "desc" : "asc"; pred.sort = th.dataset.sort; pred.offset = 0; return load(); }
  if (e.target.id === "pr-all") pred.rows.forEach((_, i) => toggle(i, e.target.checked));
  else if (tr) { pred.cur = +tr.dataset.i; if (e.target.type === "checkbox") toggle(pred.cur); }
  if (e.target.tagName === "INPUT") e.target.blur();
  renderPredictions();
});
["pr-q", "pr-value", "pr-min", "pr-max"].forEach((id) => $(id).addEventListener("change", () => { pred.offset = 0; load(); }));
$("pr-accept").addEventListener("click", acceptSelected);
$("pr-prev").addEventListener("click", () => page(-1));
$("pr-next").addEventListener("click", () => page(1));

// Rules, written out plainly: what each sets, for which charges, where it lives and who applies it.
function ruleText(r) {
  const at = r.at ? ` · set ${esc(r.at)}` : "";
  if (r.kind === "Spender") return `Spender → <b>${esc(r.sets)}</b> · all ${esc(r.name)} charges, past and future · <span class="where">labeler rule</span> applied after each daily sync${at}`;
  if (r.kind === "Name") return `Name → <b>${esc(r.sets)}</b> for ${esc(r.pattern.replace("merchant ", ""))} · <span class="where">labeler</span>${at}`;
  return `Category → <b>${esc(r.sets)}</b> · ${r.source === "preset" ? "preset rule" : "rule"} '${esc(r.name)}' (${esc(r.pattern)}) · <span class="where">Wealthfolio › Settings › Rules</span> applied by Wealthfolio on import${at}`;
}
function removeWarning(r) {
  if (r.kind === "Spender") return `Withdraw "Spender → ${r.sets}" for all ${r.name} charges? Rows fall back to account defaults or predictions; Shift+key re-applies it.`;
  if (r.kind === "Name") return `Reset the name "${r.sets}"? U undoes.`;
  return `Delete Wealthfolio rule '${r.name}'? Rows it already categorized keep their category; U restores the rule.`;
}
let armed = null, removing = false;  // a rule awaiting its confirming second press; card number-entry mode
async function removeRule(r) {
  if (!r) return;
  if (armed !== r.id) { armed = r.id; return flash(`${removeWarning(r)} Press again to confirm.`); }
  armed = null; removing = false; flash("");
  await act("/api/rules/remove", { id: r.id });
}
$("main").addEventListener("click", (e) => { const b = e.target.closest("button[data-rule]"); if (b) removeRule(card.rules[+b.dataset.rule]); });

let rules = [], rulesCur = 0;
async function loadRules() {
  const mine = loads;
  const data = await api("/api/rules");
  if (mine !== loads) return;
  const q = $("ru-q").value.toLowerCase();
  rules = data.filter((r) => `${r.kind} ${r.sets} ${r.pattern} ${r.name} ${r.source}`.toLowerCase().includes(q))
    .sort((a, b) => a.kind.localeCompare(b.kind) || b.rows - a.rows);
  rulesCur = Math.min(rulesCur, Math.max(rules.length - 1, 0));
  $("counts").textContent = `${rules.length} rule(s)`;
  renderRules();
}
function renderRules() {
  $("ru-table").innerHTML = `<tr><th>Sets</th><th>Applies to</th><th class="num">Rows</th><th>Source</th><th>Lives in</th><th>Set</th><th></th></tr>` +
    rules.map((r, i) => `<tr class="${i === rulesCur ? "cur" : ""}"><td>${esc(r.kind)} → <b>${esc(r.sets)}</b></td>
      <td class="desc">${r.kind === "Category" ? `'${esc(r.name)}' · ` : ""}${esc(r.pattern)}</td><td class="num">${r.rows}</td><td>${esc(r.source)}</td>
      <td class="muted" title="${r.where === "Wealthfolio" ? "Settings › Rules in Wealthfolio; applied by Wealthfolio when activity is imported" : "The labeler's ledger; applied after each daily sync"}">${esc(r.where)}</td><td>${esc(r.at)}</td><td><button class="link" data-rules="${i}">remove</button></td></tr>`).join("");
}
$("ru-table").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-rules]"), tr = e.target.closest("tr");
  if (b) return removeRule(rules[+b.dataset.rules]);
  if (tr && tr.rowIndex > 0) { rulesCur = tr.rowIndex - 1; renderRules(); }
});
$("ru-q").addEventListener("change", () => loadRules().catch((e) => flash(e.message)));

["a-origin", "a-min", "a-max", "a-q"].forEach((id) => $(id).addEventListener("change", () => { auditCur = 0; loadAudit().catch((e) => flash(e.message)); }));

const MODES = [...document.querySelectorAll("nav button")].map((b) => b.dataset.mode);
function show(next) { mode = next; skip = []; pinned = null; load().catch((e) => flash(e.message)); }
document.querySelectorAll("nav button").forEach((b) => b.addEventListener("click", () => { show(b.dataset.mode); b.blur(); }));

document.addEventListener("keydown", async (e) => {
  if (busy) { e.preventDefault(); return; }
  const modifier = e.ctrlKey || e.metaKey || e.altKey;
  const route = routeKey(e.key, { overlay: overlay(), typing: ["INPUT", "SELECT", "TEXTAREA"].includes(e.target.tagName), modifier });
  if (route === "close") return closeOverlays();
  if (route === "picker") return pickerKey(e);
  if (route === "type") {
    // Keys typed while the picker is open always filter it, even if its box lost focus.
    if (e.key === "Tab") e.preventDefault();
    if (e.target !== $("p-q")) {
      $("p-q").focus();
      if (e.key.length === 1 && !modifier) { e.preventDefault(); $("p-q").value += e.key; picker.cur = 0; listPicker(); }
    }
    return;
  }
  if (route === "ignore") return;
  if (e.key === "Tab") {
    // Views, not focus: leave focus on the page so the single-key shortcuts keep working.
    e.preventDefault();
    document.activeElement?.blur();
    return show(MODES[(MODES.indexOf(mode) + (e.shiftKey ? MODES.length - 1 : 1)) % MODES.length]);
  }
  if (e.key === "?") { e.preventDefault(); allKeys = !allKeys; store.set("labeler.keys", allKeys ? "all" : ""); return legend(); }
  const key = e.key.toLowerCase(), spender = config.spenders[key];
  if (key === "r" && !spender) { e.preventDefault(); return refresh(true, true).catch((err) => flash(err.message)); }
  if (mode === "predictions") {
    const row = pred.rows[pred.cur];
    if (e.key === "ArrowDown") pred.cur = Math.min(pred.cur + 1, pred.rows.length - 1);
    else if (e.key === "ArrowUp") pred.cur = Math.max(pred.cur - 1, 0);
    else if (e.key === "PageDown" || e.key === "PageUp") { e.preventDefault(); return page(e.key === "PageDown" ? 1 : -1); }
    else if (e.key === " " && row) toggle(pred.cur);
    else if (spender && row) return act("/api/label", e.shiftKey && row.name ? { value: spender, merchant: row.name } : { value: spender, ids: [row.id] });
    else if (key === "a") { e.preventDefault(); return acceptSelected(); }
    else if (key === "u") return act("/api/undo", {});
    else if (e.key === "Enter" && row) { e.preventDefault(); pred.selected.delete(row.id); return act("/api/label", { accept: [{ id: row.id, value: row.guess.value }] }); }
    else return;
    e.preventDefault(); return renderPredictions();
  }
  if (mode === "rules") {
    if (e.key === "ArrowDown") rulesCur = Math.min(rulesCur + 1, rules.length - 1);
    else if (e.key === "ArrowUp") rulesCur = Math.max(rulesCur - 1, 0);
    else if (key === "x") { e.preventDefault(); return removeRule(rules[rulesCur]); }
    else if (key === "u") return act("/api/undo", {});
    else return;
    e.preventDefault(); return renderRules();
  }
  if (mode === "audit") {
    const row = audit[auditCur];
    if (e.key === "ArrowDown") auditCur = Math.min(auditCur + 1, audit.length - 1);
    else if (e.key === "ArrowUp") auditCur = Math.max(auditCur - 1, 0);
    else if (spender && row) return act("/api/label", e.shiftKey && row.name ? { value: spender, merchant: row.name } : { value: spender, ids: [row.id] });
    else if (["c", "n", "w"].includes(key) && row) { e.preventDefault(); return openPicker({ c: null, n: "Need", w: "Want" }[key], e.shiftKey); }
    else if (key === "u") return act("/api/undo", {});
    else if (key === "h" && row) { $("a-history").textContent = JSON.stringify(await api(`/api/history?id=${row.id}`), null, 1); return; }
    else return;
    e.preventDefault(); return renderAudit();
  }
  if (!card) return;
  if (spender) label(spender, e.shiftKey);
  else if (e.key === "Enter" && !card.blind) label(card.rows[cur].guess.value, e.shiftKey);
  else if (key === "c") openPicker(null, e.shiftKey);
  else if (key === "n") openPicker("Need", e.shiftKey);
  else if (key === "w") openPicker("Want", e.shiftKey);
  else if (key === "s" || e.key === " " || e.key === "ArrowRight") nextCard();
  else if (e.key === "ArrowLeft") previousCard();
  else if (key === "u") act("/api/undo", {});
  else if (key === "m" && mode === "queue") openRename(!e.shiftKey);
  else if (key === "x" && card.rules.length) { removing = true; armed = null; flash(`Remove which rule? Press 1–${card.rules.length}; Esc cancels.`); }
  else if (removing && /^[1-9]$/.test(e.key)) removeRule(card.rules[+e.key - 1]);
  else if (key === "o" && mode === "queue") {
    const i = ORDERS.findIndex(([v]) => v === $("order").value);
    setOrder(ORDERS[(i + (e.shiftKey ? ORDERS.length - 1 : 1)) % ORDERS.length][0]);
  }
  else if (e.key === "'") { $("note").value = note; openOverlay("note"); $("note").focus(); }
  else if (e.key === "ArrowDown") { cur = Math.min(cur + 1, card.rows.length - 1); render(); }
  else if (e.key === "ArrowUp") { cur = Math.max(cur - 1, 0); render(); }
  else return;
  e.preventDefault();
});

// Labels and rows also change outside this page. The cheap version poll catches labeler writes;
// a re-read from Wealthfolio (on focus, every minute, or R) catches everything else.
let rereading = null;  // focus and visibility fire together; one re-read serves both
async function refresh(force, reread) {
  if (busy || document.hidden || overlay() || ["INPUT", "SELECT"].includes(document.activeElement?.tagName)) return;
  if (reread && rereading) return rereading;
  const pending = api(reread ? "/api/refresh" : "/api/version");
  if (reread) rereading = pending.finally(() => { rereading = null; });
  const { version } = await pending;
  if (force || version !== seen) await load();
}
window.addEventListener("focus", () => refresh(true, true).catch((e) => flash(e.message)));
document.addEventListener("visibilitychange", () => refresh(true, true).catch((e) => flash(e.message)));
setInterval(() => refresh(false, false).catch(() => {}), 3000);
setInterval(() => refresh(false, true).catch(() => {}), 60000);

(async () => { config = await api("/api/config"); load(); })().catch((e) => flash(e.message));
</script>
</body>
